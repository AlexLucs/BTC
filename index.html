<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <!--
        CSP: restringe de onde vêm scripts, estilos e conexões.
        - 'unsafe-eval' é exigido pelo pywebview (api.js monta a ponte JS→Python com new Function).
        - 'unsafe-inline' em style-src: pywebview e TradingView injetam <style>.
        - file: cobre a página aberta direto do disco (navegador e testes); o app a serve
          por http://127.0.0.1:42001 (servidor_local.py).
        - 'self' em connect-src: o 1º preço buscado pelo Python vem do servidor local
          (http://127.0.0.1:42001/preco-inicial, ver servidor_local.py).
        Ao trocar de API ou de widget, atualize connect-src / script-src / frame-src.
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        script-src 'self' file: 'unsafe-eval' https://s3.tradingview.com;
        style-src 'self' file: 'unsafe-inline';
        font-src 'self' file:;
        img-src 'self' file: data:;
        media-src 'self' file:;
        connect-src 'self' https://api.binance.com wss://stream.binance.com:9443 https://economia.awesomeapi.com.br https://mempool.space;
        frame-src https://*.tradingview.com https://*.tradingview-widget.com;
        base-uri 'none';
        form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="favicon" rel="icon" href="btc-logo.svg">
    <title>BTC Status - Monitoramento de Preço do Bitcoin</title>
    <!-- Pré-conexão: DNS + TCP + TLS com os servidores começam durante a leitura do HTML,
         antes de script.js pedir os dados. O Chromium aceita a dica se alguma diretiva da
         CSP acima permitir o endereço. "crossorigin" nas APIs: o fetch() entre origens usa
         conexões sem credenciais, e só a pré-conexão do mesmo tipo é aproveitada.
         O WebSocket não reaproveita a conexão HTTP: para ele, só a resolução de DNS.
         O TradingView não tem dica: o gráfico abre oculto, e a conexão antecipada seria
         aberta à toa em toda abertura (ele conecta quando o usuário clica em ⇄).
         Cada dica fica numa linha só (tools/medir_abertura.py --comparar preconnect
         as remove para medir a diferença). -->
    <link rel="preconnect" href="https://api.binance.com" crossorigin>
    <link rel="preconnect" href="https://economia.awesomeapi.com.br" crossorigin>
    <link rel="preconnect" href="https://mempool.space" crossorigin>
    <link rel="dns-prefetch" href="https://stream.binance.com">
    <!-- A fonte começa a ser lida junto com o HTML: o "load" da página (que libera a ponte
         do pywebview) espera por ela. Aqui vai SEM "crossorigin", que é o certo por file://
         (navegador e testes). No app a página vem por http e servidor_local.py acrescenta o
         atributo; sem ele, por http, o Chromium descarta o preload e lê a fonte duas vezes.
         Não mudar esta linha sem mudar PRELOAD_FONTE em servidor_local.py. -->
    <link rel="preload" href="Roboto.woff2" as="font" type="font/woff2">
    <link rel="stylesheet" href="style.css">
    <script src="metricas.js" defer></script>
    <script src="regras.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <!-- Container principal; a classe marca onde se arrasta a janela do app (script.js:
         aoPressionarParaArrastar). Não usar "pywebview-drag-region": ligaria o arraste
         pelo JS do pywebview, que ignora as bordas da tela. -->
    <div id="conteudo" class="regiao-arraste">
        <!-- Controles da janela (ocultos por padrão; script.js exibe os que se aplicam) -->
        <div class="botao">
            <button type="button" class="btns" id="centralizar-btn" title="Centralizar" aria-label="Centralizar">▣</button>
            <button type="button" class="btns" id="reload-btn" title="Atualizar" aria-label="Atualizar">↻</button>
            <button type="button" class="btns" id="pausar-btn" title="Pausar" aria-label="Pausar">■</button>
            <button type="button" class="btns" id="fixar-btn" title="Fixar no topo" aria-label="Fixar no topo">△</button>
            <button type="button" class="btns" id="alerta-btn" title="Alertas de preço" aria-label="Alertas de preço">⏱︎</button>
            <button type="button" class="btns" id="minimize-btn" title="Minimizar" aria-label="Minimizar">_</button>
            <button type="button" class="btns" id="close-btn" title="Fechar" aria-label="Fechar">x</button>
            <button type="button" class="btns" id="grafico-btn" title="Mostrar/ocultar gráfico" aria-label="Mostrar ou ocultar gráfico">⇄</button>
            <!-- Modo compacto: ⊟ compacta, ⊞ volta ao modo completo (script.js: alternarCompacto) -->
            <button type="button" class="btns" id="compacto-btn" title="Modo compacto" aria-label="Modo compacto">⊟</button>
        </div>

        <!-- Gráfico de candles BTC/BRL (widget externo do TradingView).
             O widget fica no <template> e só é montado em #grafico enquanto está visível
             e o monitoramento está ativo (script.js: atualizarGrafico).
             O atributo "hidden" define o padrão ao abrir: com ele, o gráfico começa oculto
             (nada do TradingView é carregado até o clique em ⇄); sem ele, começa visível. -->
        <div id="grafico" class="grafico" title="Gráfico" hidden></div>
        <template id="grafico-modelo">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
                {
                    "lineWidth": 2,
                    "lineType": 0,
                    "chartType": "candlesticks",
                    "fontColor": "rgba(100, 100, 100, 1)",
                    "gridLineColor": "rgba(242, 242, 242, 0.06)",
                    "volumeUpColor": "rgba(34, 171, 148, 0.5)",
                    "volumeDownColor": "rgba(247, 82, 95, 0.5)",
                    "backgroundColor": "rgba(0, 0, 0, 1)",
                    "widgetFontColor": "rgba(100, 100, 100, 1)",
                    "upColor": "rgba(247, 147, 26, 1)",
                    "downColor": "rgba(100, 100, 100, 1)",
                    "borderUpColor": "rgba(247, 147, 26, 1)",
                    "borderDownColor": "rgba(100, 100, 100, 1)",
                    "wickUpColor": "rgba(247, 147, 26, 1)",
                    "wickDownColor": "rgba(100, 100, 100, 1)",
                    "colorTheme": "dark",
                    "isTransparent": false,
                    "locale": "br",
                    "chartOnly": true,
                    "scalePosition": "right",
                    "scaleMode": "Normal",
                    "fontFamily": "Roboto",
                    "valuesTracking": "1",
                    "changeMode": "no-values",
                    "symbols": [["BINANCE:BTCBRL|5D"]],
                    "dateRanges": ["1d|15", "5d|60"],
                    "fontSize": "10",
                    "headerFontSize": "small",
                    "autosize": true,
                    "dateFormat": "dd/MM/yy",
                    "width": "100%",
                    "height": "100%",
                    "noTimeScale": false,
                    "hideDateRanges": false
                }
                </script>
            </div>
        </template>

        <!-- Exibido quando o monitoramento está pausado (manual, por falhas ou por inatividade) -->
        <div id="overlay" class="overlay" title="Clique para retomar o monitoramento" aria-label="Retomar monitoramento" role="button">⏸</div>
        <!-- Fundo escurecido atrás da tela de alertas; clicar fecha a tela -->
        <div id="darkback" class="overlay"></div>

        <!-- Tela de carregamento inicial -->
        <div id="tela-carregamento">
            <div class="girando">⟳</div>
            <button type="button" id="close-btn-carregamento" title="Fechar" aria-label="Fechar">x</button>
        </div>

        <!-- Tela de cadastro de alertas -->
        <div id="modalAlerta" class="modal">
            <div class="modal-content">
                <p>ALERTAS</p>
                <form id="inputForm">
                    <input type="number" id="valorAlerta" name="valor" min="0.01" step="0.01"
                        title="Valor em reais a ser monitorado." placeholder="Digite o valor em Reais" required>
                    <!-- Só a lista rola: campo e botões ficam sempre visíveis -->
                    <div id="listaAlertas">
                        <table id="alertasTabela">
                            <tbody>
                                <!-- Linhas inseridas por script.js -->
                            </tbody>
                        </table>
                    </div>
                    <div id="botoesAlerta">
                        <button type="button" class="botao-padrao" id="salvarBotao" title="Criar alerta">Criar Alerta</button>
                        <button type="button" class="botao-padrao" id="voltarBotao" title="Fechar alertas">Voltar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Informações principais -->
        <div id="conteudoMenosBotoes">
            <div id="info-logo" title="Bitcoin Monitor">₿</div>
            <div id="info-price" class="btc_em_brl_principal" title="Preço atual do Bitcoin em Reais (BRL). Dados da Binance©."></div>
            <div id="info-usdt" class="btc_em_usdt_secundario" title="Preço atual do Bitcoin em dólares (USDT). Dados da Binance©."></div>
            <!-- Duas partes com fontes diferentes: cada uma fica esmaecida enquanto mostra o valor salvo -->
            <div id="info-dolar" class="dolar_btc_e_b3" title="Dólar implícito (BTC/BRL ÷ BTC/USDT, Binance©) | Dólar comercial (AwesomeAPI©)."><span id="dolar-implicito"></span> | <span id="dolar-comercial"></span></div>
            <div class="percentual" title="Variação percentual do preço do Bitcoin nas últimas 24 horas.">
                <span id="info-percent"></span>
                <!-- Começa com a seta neutra: o número já aparece com ela e não se desloca depois -->
                <span id="info-seta" class="seta-neutra">↔</span>
            </div>
            <div id="info-time" class="horario_atualizacao" title="Data e hora da última atualização."></div>

            <!-- Máximas/mínimas de 24h e taxas da rede -->
            <div class="bottom-left-info">
                <table>
                    <tbody>
                        <tr><td colspan="2"><hr class="separator"></td></tr>
                        <tr title="Preço máximo do Bitcoin em Reais nas últimas 24 horas. Dados da Binance©.">
                            <td class="rotulo">Máxima:</td>
                            <td class="valor" id="highPrice"></td>
                        </tr>
                        <tr title="Preço mínimo do Bitcoin em Reais nas últimas 24 horas. Dados da Binance©.">
                            <td class="rotulo">Mínima:</td>
                            <td class="valor" id="lowPrice"></td>
                        </tr>
                        <tr title="Preço máximo do Bitcoin em dólares (USDT) nas últimas 24 horas. Dados da Binance©.">
                            <td class="rotulo">Máx. USDT:</td>
                            <td class="valor" id="highPriceDol"></td>
                        </tr>
                        <tr title="Preço mínimo do Bitcoin em dólares (USDT) nas últimas 24 horas. Dados da Binance©.">
                            <td class="rotulo">Mín. USDT:</td>
                            <td class="valor" id="lowPriceDol"></td>
                        </tr>
                        <tr><td colspan="2"><hr class="separator"></td></tr>
                        <tr>
                            <td id="taxa_topico" colspan="2" title="Taxas estimadas de transação Bitcoin. Fonte: mempool.space©. Atualizadas a cada 50–70 s.">Taxas de Rede</td>
                        </tr>
                        <tr><td colspan="2"><hr class="separator"></td></tr>
                        <tr title="Taxa mínima estimada (menor prioridade, confirmação mais demorada).">
                            <td class="rotulo">Mínima:</td>
                            <td class="valor" id="minimumFee"></td>
                        </tr>
                        <tr title="Taxa estimada para confirmação em ~1 hora.">
                            <td class="rotulo">~1 hora:</td>
                            <td class="valor" id="hourFee"></td>
                        </tr>
                        <tr title="Taxa estimada para confirmação em ~30 minutos.">
                            <td class="rotulo">~30 min:</td>
                            <td class="valor" id="halfHourFee"></td>
                        </tr>
                        <tr title="Taxa de prioridade estimada (confirmação no próximo bloco).">
                            <td class="rotulo">Próximo bloco:</td>
                            <td class="valor" id="fastestFee"></td>
                        </tr>
                        <tr><td colspan="2"><hr class="separator"></td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Rodapé do modo compacto (classe "compacto" no <html>): máxima e mínima de 24 h em
                 uma linha. Oculto no modo completo, em que a tabela acima mostra os mesmos valores. -->
            <div id="info-faixa">
                <span title="Preço máximo do Bitcoin em Reais nas últimas 24 horas. Dados da Binance©."><span class="rotulo">Máxima:</span> <span id="faixaMaxima"></span></span>
                <span title="Preço mínimo do Bitcoin em Reais nas últimas 24 horas. Dados da Binance©."><span class="rotulo">Mínima:</span> <span id="faixaMinima"></span></span>
            </div>
        </div>
    </div>

    <!-- Diálogo de avisos e alertas (fora da região de arrasto) -->
    <dialog id="dialogo" aria-labelledby="dialogo-titulo">
        <form method="dialog">
            <h2 id="dialogo-titulo"></h2>
            <p id="dialogo-conteudo"></p>
            <button type="submit" class="botao-padrao" id="dialogo-ok">OK</button>
        </form>
    </dialog>
</body>

</html>
